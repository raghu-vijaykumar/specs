[mcp_servers.github]
url = "https://api.github.com/mcp"
auth = "oauth"
required = false
enabled = true

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "C:\\workspace", "C:\\Users\\Raghu"]
required = false
enabled = true

[mcp_servers.brave-search]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
required = false
enabled = true
[mcp_servers.brave-search.env]
BRAVE_API_KEY = ""

[mcp_servers.opensrc]
command = "node"
args = ["scripts/opensrc-mcp-server.mjs"]
cwd = "."
required = false
enabled = true
